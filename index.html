<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314121b'/%3E%3Crect x='4' y='3' width='8' height='7' fill='%23e8b44f'/%3E%3Crect x='6' y='5' width='1' height='2' fill='%2314121b'/%3E%3Crect x='9' y='5' width='1' height='2' fill='%2314121b'/%3E%3C/svg%3E">
<title>中世纪像素人物生成器</title>
<style>
  :root{
    --bg:#14121b; --panel:#1d1a26; --panel2:#262232; --line:#332e42;
    --fg:#ece8f5; --muted:#8f88a6; --accent:#e8b44f; --accent2:#7fd1b9;
    --radius:10px;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f2efe8; --panel:#fffdf8; --panel2:#f0ece2; --line:#ddd6c8;
           --fg:#211d17; --muted:#7a7263; --accent:#8a5c0a; --accent2:#2f7f68; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .app{
    display:grid; grid-template-columns:auto 340px; gap:22px;
    align-items:start; max-width:860px; width:100%;
  }
  .topbar{
    grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:-6px;
  }
  .topbar select{
    width:auto; min-width:118px; font-size:12.5px; padding:6px 24px 6px 10px;
    background-color:var(--panel); border-color:var(--line);
  }
  @media (max-width:720px){
    .app{ grid-template-columns:1fr; }
    .side{ order:2; }
    .topbar{ margin-bottom:0; }
  }

  /* ---- 舞台 ---- */
  .stage{ display:flex; flex-direction:column; gap:14px; }
  .headline{ font-size:15px; font-weight:600; letter-spacing:.02em; display:flex; align-items:baseline; gap:9px; }
  .headline span{ font-size:11.5px; font-weight:400; color:var(--muted); letter-spacing:.04em; }
  .frame{
    position:relative; width:384px; height:384px;   /* 48px × 8 整数倍，像素不变形 */
    background:
      linear-gradient(45deg,#0000 25%,#ffffff0d 25%,#ffffff0d 50%,#0000 50%,#0000 75%,#ffffff0d 75%)
      0 0/24px 24px,
      linear-gradient(45deg,#0000 25%,#ffffff0d 25%,#ffffff0d 50%,#0000 50%,#0000 75%,#ffffff0d 75%)
      12px 12px/24px 24px,
      var(--panel);
    border-radius:var(--radius); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  @media (max-width:430px){
    .frame{ width:288px; height:288px; }   /* 小屏退到 48×6，仍是整数倍 */
  }
  #view{ width:384px; height:384px; image-rendering:pixelated; display:block; }
  @media (max-width:430px){
    #view{ width:288px; height:288px; }
  }
  .grid-on #grid{ display:block; }
  #grid{
    position:absolute; inset:0; pointer-events:none; display:none;
    background-size:calc(100% / 48) calc(100% / 48);
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.09) 1px, transparent 1px);
  }
  @media (prefers-color-scheme: light){
    #grid{
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.09) 1px, transparent 1px);
    }
  }

  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  button{
    font:inherit; font-size:14px; cursor:pointer; color:var(--fg);
    background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:9px 14px; transition:.12s;
  }
  button:hover{ border-color:var(--muted); transform:translateY(-1px); }
  button:active{ transform:translateY(0); }
  button.active{ background:var(--accent); color:#1d1502; border-color:transparent; font-weight:600; }
  #roll{ background:var(--accent); color:#1d1502; border-color:transparent; font-weight:600; }
  button:focus-visible, .sw:focus-visible, .recent canvas:focus-visible{
    outline:2px solid var(--accent2); outline-offset:2px;
  }
  /* 浅色模式：主按钮改为深底金字（7.3:1），保证对比度；须在 #roll 基础样式之后 */
  @media (prefers-color-scheme: light){
    button{ color:#3a3428; }
    #roll, button.active{ background:#5c4a1e; color:#f5edd8; border-color:transparent; }
  }
  kbd{
    font:inherit; font-size:10px; padding:1px 5px; border-radius:4px;
    background:#0003; margin-left:6px; opacity:.75;
  }

  /* ---- 侧栏 ---- */
  .side{ display:flex; flex-direction:column; gap:14px; }
  .block{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; }
  .label{ font-size:12px; letter-spacing:.14em; color:var(--muted); margin-bottom:8px; }
  .seedrow{ display:flex; gap:6px; }
  .seedrow input, input[type=text]{
    flex:1; min-width:0; font:inherit; font-size:13px; font-family:var(--font-mono,ui-monospace,monospace);
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:8px 10px;
  }
  input:focus{ outline:2px solid var(--accent2); outline-offset:-1px; }
  .seedrow button{ padding:8px 12px; font-size:13px; }
  .hint{ margin:8px 0 0; font-size:12px; color:var(--muted); line-height:1.5; }

  /* 档案卡片 */
  .profile-hero{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 12px; border-radius:7px;
    background:var(--panel2); border:1px solid var(--line); margin-bottom:8px;
  }
  .profile-role{
    font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.02em;
  }
  .profile-badge{
    font-size:11.5px; padding:2px 8px; border-radius:4px;
    background:rgba(255,255,255,0.06); color:var(--muted); font-weight:500;
  }
  @media (prefers-color-scheme: light){
    .profile-badge{ background:rgba(0,0,0,0.06); }
  }
  .profile-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:6px;
  }
  .profile-item{
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:6px 9px; font-size:12px;
    display:flex; justify-content:space-between; align-items:baseline; gap:8px; min-width:0;
  }
  .profile-item span{ color:var(--muted); font-size:11px; flex:0 0 auto; }
  .profile-item b{
    font-weight:500; color:var(--fg); text-align:right;
    min-width:0; overflow-wrap:anywhere;
  }
  .profile-item.wide{ grid-column:1 / -1; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; margin:-1px;
    clip:rect(0 0 0 0); overflow:hidden; white-space:nowrap;
  }

  /* ---- 三档同屏 ---- */
  .sizes{
    display:flex; gap:10px; align-items:flex-end; justify-content:center;
  }
  .sizebox{
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .sizebox canvas{
    image-rendering:pixelated; display:block;
    background:var(--panel2); border:1px solid var(--line); border-radius:6px;
  }
  .sizebox span{
    font-size:11px; color:var(--muted); letter-spacing:.06em;
  }
  .sizebox.main canvas{ border-color:var(--accent); }
  .sizebox.main span{ color:var(--fg); font-weight:600; }
  #pvS{ width:96px; height:96px; }     /* 24 × 4 整数倍 */
  #pvM{ width:192px; height:192px; }   /* 48 × 4 整数倍 */
  @media (max-width:430px){
    #pvS{ width:72px; height:72px; }
    #pvM{ width:144px; height:144px; }
  }

  .recent{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .recent canvas{
    width:100%; aspect-ratio:1; image-rendering:pixelated; border-radius:5px;
    background:var(--panel2); border:1px solid var(--line); cursor:pointer;
  }
  .recent canvas:hover{ border-color:var(--accent); }
  .recent canvas.on{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }

  /* ---- 定制面板 ---- */
  .forge{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .field{ display:flex; flex-direction:column; gap:3px; }
  .field.wide{ grid-column:1 / -1; }
  .field > span{ font-size:11.5px; color:var(--muted); letter-spacing:.05em; }
  select{
    font:inherit; font-size:12px; color:var(--fg); width:100%;
    background-color:var(--panel2); border:1px solid var(--line); border-radius:6px;
    padding:6px 22px 6px 7px; cursor:pointer; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;
    background-size:4px 4px,4px 4px; background-repeat:no-repeat;
  }
  select:hover{ border-color:var(--muted); }
  select:focus{ outline:2px solid var(--accent2); outline-offset:-1px; }
  select:disabled{ opacity:.42; cursor:not-allowed; }
  select.locked{
    border-color:var(--accent2);
    box-shadow:0 0 0 1px var(--accent2) inset;
  }
  .swatches{ display:flex; gap:5px; flex-wrap:wrap; padding:2px 0; }
  .sw{
    width:22px; height:22px; border-radius:5px; cursor:pointer; padding:0;
    border:1px solid var(--line); transition:.12s;
  }
  .sw:hover{ transform:translateY(-1px); border-color:var(--muted); }
  .sw[aria-pressed="true"]{ outline:2px solid var(--accent); outline-offset:1px; }
  .forge-actions{ display:flex; gap:6px; margin-top:9px; }
  .forge-actions button{ flex:1; padding:7px 10px; font-size:12.5px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="headline">中世纪人物<span>随机像素肖像 · 48×48</span></div>
    <select id="langSel" aria-label="Language" title="Language / 语言">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="view" width="48" height="48" role="img" aria-label="pixel portrait"></canvas>
      <div id="grid"></div>
    </div>
    <div class="controls">
      <button id="roll">随机一个<kbd>空格</kbd></button>
      <button id="save">下载 PNG</button>
      <button id="copy">复制种子</button>
      <button id="toggleGrid" title="显示像素网格">网格</button>
    </div>
    <div class="sizes" id="sizes">
      <div class="sizebox main"><canvas id="pvM" width="48" height="48"></canvas><span>M · 48</span></div>
      <div class="sizebox"><canvas id="pvS" width="24" height="24"></canvas><span>S · 24</span></div>
    </div>
    <div class="block" id="recentBlock">
      <div class="label">最近 RECENT</div>
      <div id="recent" class="recent"></div>
    </div>
  </div>

  <aside class="side">
    <div class="block" id="seedBlock">
      <div class="label">种子 SEED</div>
      <div class="seedrow">
        <label for="seed" class="visually-hidden">seed</label>
        <input id="seed" type="text" value="1024" spellcheck="false" autocomplete="off">
        <button id="apply">生成</button>
      </div>
      <p class="hint">同一个种子永远长出同一个人。填数字或任意文字都行。</p>
    </div>

    <div class="block" id="profileBlock">
      <div class="label">档案 PROFILE</div>
      <div id="traits"></div>
    </div>

    <div class="block" id="forgeBlock">
      <div class="label">定制 FORGE</div>
      <div id="forge" class="forge"></div>
      <div class="forge-actions">
        <button id="forgeReset" disabled>清空全部锁定</button>
      </div>
    </div>
  </aside>
</div>

<script>
/* =========================================================
   48×48 像素人物生成器
   思路：分层绘制 + 有限调色板 + 外轮廓描边
   层序：背景 → 后发 → 身体/衣服 → 脸 → 前发 → 五官 → 配饰 → 描边
   支持 24 / 48 / 96 三档：每档独立绘制，大图加细节、小图做减法
   ========================================================= */
const W = 48, H = 48;      // 默认档
const SIZES = { S: 24, M: 48 };
const OUTLINE = '#171120';

/* ---------- 随机 ---------- */
function hashStr(s){
  s = String(s);
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 颜色 ---------- */
function rgbOf(hex){
  const n = parseInt(hex.slice(1), 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function hexOf(r, g, b){
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
// amt > 0 提亮，< 0 压暗
function shade(hex, amt){
  const [r, g, b] = rgbOf(hex);
  const f = v => amt >= 0 ? v + (255 - v) * amt : v * (1 + amt);
  return hexOf(f(r), f(g), f(b));
}
function mixHex(a, b, t){
  const A = rgbOf(a), B = rgbOf(b);
  return hexOf(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function desat(hex, amt){
  const [r, g, b] = rgbOf(hex);
  const l = r * 0.299 + g * 0.587 + b * 0.114;
  return hexOf(r + (l - r) * amt, g + (l - g) * amt, b + (l - b) * amt);
}
function luma(hex){
  const [r, g, b] = rgbOf(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}
function hslOf(hex){
  const [r0, g0, b0] = rgbOf(hex);
  const r = r0 / 255, g = g0 / 255, b = b0 / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (max + min) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  return { h, s, l };
}
// 把色值翻成中世纪染料档位，显示名交给 i18n
function clothKey(hex){
  const { h, s, l } = hslOf(hex);
  if (s < 0.13) return l > 0.5 ? 'ash' : 'lime';
  let n;
  if (h < 14 || h >= 342) n = 'madder';
  else if (h < 40) n = 'ochre';
  else if (h < 64) n = 'weld';
  else if (h < 104) n = 'moss';
  else if (h < 160) n = 'pine';
  else if (h < 205) n = 'slate';
  else if (h < 262) n = 'woad';
  else if (h < 302) n = 'ink';
  else n = 'murrey';
  if (l < 0.24) n = 'dark' + n; else if (l > 0.5) n = 'pale' + n;
  return n;
}
function hairKey(hex){
  const { h, s, l } = hslOf(hex);
  if (s < 0.14) return l > 0.66 ? 'silver' : (l > 0.42 ? 'grizzled' : 'black');
  if (l < 0.17) return 'black';
  if (h >= 20 && h < 46) return l > 0.45 ? 'flaxen' : 'chestnut';
  if (h < 20 || h >= 340) return l > 0.35 ? 'auburn' : 'deepchestnut';
  if (h >= 46 && h < 78) return 'golden';
  return 'brown';
}
function skinKey(hex){
  const l = luma(hex);
  if (l > 0.82) return 'fair';
  if (l > 0.7) return 'lightwheat';
  if (l > 0.57) return 'wheat';
  if (l > 0.44) return 'olive';
  if (l > 0.31) return 'deepbrown';
  return 'ebony';
}

/* ---------- 画布 ---------- */
class Grid{
  constructor(w, h){ this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  set(x, y, c){
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    this.d[y * this.w + x] = c;
  }
  get(x, y){
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.d[y * this.w + x];
  }
  line(x1, y1, x2, y2, c){
    let dx = Math.abs(x2 - x1), dy = Math.abs(y2 - y1);
    let sx = x1 < x2 ? 1 : -1, sy = y1 < y2 ? 1 : -1, err = dx - dy;
    for(;;){
      this.set(x1, y1, c);
      if (x1 === x2 && y1 === y2) break;
      const e2 = err * 2;
      if (e2 > -dy){ err -= dy; x1 += sx; }
      if (e2 < dx){ err += dx; y1 += sy; }
    }
  }
  // 外轮廓：不透明像素外扩 1px
  outline(col){
    const out = this.d.slice();
    for (let y = 0; y < this.h; y++){
      for (let x = 0; x < this.w; x++){
        if (this.d[y * this.w + x]) continue;
        if (this.get(x - 1, y) || this.get(x + 1, y) || this.get(x, y - 1) || this.get(x, y + 1))
          out[y * this.w + x] = col;
      }
    }
    this.d = out;
  }
}

/* ---------- 素材表 ---------- */
const SKINS = ['#f2cba6', '#e8b990', '#dda57a', '#c98a5e', '#b3774d', '#96603c', '#7a4a2c', '#5a3620',
               '#dda57a', '#c98a5e', '#b3774d'];
const HAIRS = ['#2a2230', '#33261c', '#402a1a', '#553420', '#76492a', '#9c6f37', '#cfa24c', '#a84a2a',
               '#7a4a3a', '#5a4536', '#8a8378', '#b8b2a8'];
/* 中世纪身份：决定衣着、头饰与配色，颜色取自天然染料（茜草红、菘蓝、苔绿、亚麻、赭石） */
const ARCHETYPES = [
  { id:'farmer',     cloth:['#8a7350','#7a6a4a','#6f5b3e','#9a8a62','#5f6b4a','#8a6a52'], kind:'tunic',    gear:['hood','straw','none','none','coif'] },
  { id:'monk',       sex:'M', cloth:['#5a4a36','#4a3a2a','#6b5a42','#3f3528'],                 kind:'robe',     gear:['tonsure','cowl','none'] },
  { id:'knight',     cloth:['#6b2f45','#3f4a7a','#4a6b3f','#7a3f2f','#5a3f6b'],                 kind:'chainmail',gear:['helmet','none'] },
  { id:'noble',      cloth:['#6b2f45','#3f4a7a','#4a6b3f','#7a3f2f','#5a3f6b'],       kind:'doublet',  gear:['crown','circlet','veil','coif','none'] },
  { id:'soldier',    cloth:['#6b5a42','#5a4a36','#7a6a4a'],                           kind:'gambeson', gear:['helmet','cap','none'] },
  { id:'merchant',   cloth:['#5a6b4a','#7a5a3f','#4a5a6b','#6b4a3f'],                 kind:'tunic',    gear:['cap','hood','none'] },
  { id:'bard',       cloth:['#6b3f6b','#7a4a2f','#4a6b6b','#8a5a2f'],               kind:'doublet',  gear:['cap','hood','wreath','none'] },
  { id:'beggar',     cloth:['#5a5040','#4a4234','#6b5f4a'],                           kind:'rags',     gear:['none','hood','straw'] },
  { id:'nun',        sex:'F', cloth:['#2f3540','#3a4050','#4a5060'],                           kind:'robe',     gear:['wimple','veil'] },
  { id:'witch',      sex:'F', cloth:['#3a2f4a','#4a2f3f','#2f3a4a'],                           kind:'robe',     gear:['hood','straw','wreath'] },
  { id:'blacksmith', cloth:['#5a4a3a','#4a3a2a','#6b5a4a'],                           kind:'tunic',    gear:['cap','none'], apron:true },
  { id:'archer',     cloth:['#4a5a3f','#5a5a3a','#3f4a3a'],                           kind:'cloak',    gear:['hood','cap'] },
  { id:'bishop',     sex:'M', cloth:['#6b2f45','#3a2f4a','#4a2f3f','#2f3a4a'],       kind:'robe',     gear:['mitre','cap'] },
  { id:'pilgrim',    cloth:['#8a7a58','#6f6a52','#7a6a4a','#5f6b4a'],                 kind:'tunic',    gear:['hood','coif','straw','none'] },
  { id:'alchemist',  cloth:['#2f4a44','#3a3a56','#4a3f5a','#2f3a4a'],               kind:'robe',     gear:['hood','cap','none'] },
  { id:'fisher',     cloth:['#4a5a6b','#3f4a58','#5a6b6f','#6b6a52'],                 kind:'tunic',    gear:['straw','coif','none'] },

/* ---------- 头部轮廓：6 种脸型真正改变下颌/颧骨结构 ---------- */
function headHW(y, cy, rx, ry, shape){
  const t = (y - cy) / ry;
  if (t < -1 || t > 1) return -1;
  let hw = rx * Math.sqrt(Math.max(0, 1 - t * t));
  if (shape === 'square'){

  } else if (shape === 'pointed'){
    // 尖下巴：从颧骨下快速收成 V
    if (t > 0) hw *= 1 - 0.72 * t * t;
    if (t > 0.8) hw = Math.max(1, Math.round(hw * 0.8));
  } else if (shape === 'heart'){
    // 心形：宽额头 + 尖下巴，中间颧骨最宽
    if (t > 0) hw *= 1 - 0.88 * (t - 0.05) * (t - 0.05);
    if (t > 0.8) hw = Math.max(1, Math.round(hw * 0.85));
  } else if (shape === 'long'){
    hw *= 0.88;
    // 长脸：脸颊瘦削，下颌窄但不尖
    if (t > 0.5) hw *= 1 - 0.25 * (t - 0.5);
  } else if (shape === 'wide'){
    hw *= 1.07;
    // 宽脸：下颌圆厚，不到尖
    if (t > 0.6) hw = Math.max(hw, rx * 0.55);

    if (t > 0.6) hw = Math.max(hw, rx * 0.5);
  }
  return Math.round(hw);
}
function ellipseHW(y, cy, rx, ry){
  const t = (y - cy) / ry;
  if (Math.abs(t) > 1) return -1;
  return Math.round(rx * Math.sqrt(1 - t * t));
}
function fillHead(g, cx, cy, rx, ry, shape, color, exp, lim){
  for (let y = cy - ry - exp; y <= cy + ry + exp; y++){

    if (hw < 0) continue;
    for (let x = cx - hw - exp; x <= cx + hw + exp; x++){

        g.set(x, mouthY, '#4a1f22'); g.set(x, mouthY + 1, '#7a3033');
      }
      break;
    case 'lips':
      hline(mouthY, mouthX, mouthX + mw - 1, lipC);
      hline(mouthY + 1, mouthX, mouthX + mw - 1, shade(lipC, -0.2));
      if (lipTier !== 'none'){ hline(mouthY - 1, mouthX + 1, mouthX + mw - 2, shade(lipC, 0.18)); }  // 饱满上唇
      break;
  }

  // 胡须：属于基因（外观身份），用基因流挑选；绘制细节才用绘制流
  const beardBase = (gender === 'M' && age > 0.3 && chance(0.55))
    ? pick(['stubble', 'mustache', 'goatee', 'full', 'longbeard']) : 'none';
  const beard = ov.beard != null ? ov.beard : beardBase;
  if (beard !== 'none'){
    let bc = mixHex(hairC, skinD, 0.2);
    // 胡须必须比肤色深：浅发色在深肤上会读成一片白点
    if (luma(bc) > luma(skin) - 0.08) bc = shade(mixHex(hairC, skinD, 0.4), -0.25);
    // 嘴角保护区（左右各留 2px 空隙）；24 档嘴小，保护区也小
    const mclear = size >= 96 ? 3 : 2;
    if (beard === 'stubble'){
      // 96 档胡茬：只画下巴与腮线，点密度更高但成片，避免噪点
      const y0 = size >= 96 ? cy + 5 : cy + 4;
      for (let y = y0; y <= cy + ry - 1; y++){
        const hw = headHW(y, cy, rx, ry, shape);
        if (hw < 0) continue;
        for (let x = cx - hw + 1; x <= cx + hw - 1; x++){
          const d = Math.abs(x - cx);
          if (y < mouthY - 1 && d >= mclear - 1 && d <= mclear + 1) continue;   // 嘴角区域不留茬
          if (dchance(size >= 96 ? 0.34 : 0.28)) g.set(x, y, bc);
        }
      }
    } else if (beard === 'mustache'){
      const mw2 = size >= 96 ? 4 : 2;
      hline(mouthY - 2, mouthC - mw2, mouthC + mw2, bc);
      g.set(mouthC - mw2 - 1, mouthY - 1, bc); g.set(mouthC + mw2 + 1, mouthY - 1, bc);
    } else if (beard === 'goatee'){
      hline(mouthY - 2, mouthC - 2, mouthC + 2, bc);
      for (let y = mouthY + 2; y <= cy + ry - 1; y++) hline(y, mouthC - 1, mouthC + 1, bc);
    } else if (beard === 'full'){
      for (let y = mouthY - 1; y <= cy + ry; y++){
        const hw = headHW(y, cy, rx, ry, shape);
        if (hw < 0) continue;
        for (let x = cx - hw + 1; x <= cx + hw - 1; x++){
          if (y <= mouthY + 1 && Math.abs(x - mouthC) < mclear) continue;   // 嘴露出来
          g.set(x, y, bc);
        }
      }
      hline(mouthY - 2, mouthC - 2, mouthC + 2, bc);
    } else if (beard === 'longbeard'){
      const bcL = mixHex(hairC, skinD, 0.38);
      for (let y = mouthY; y <= cy + ry + 6; y++){
        const base = headHW(Math.min(y, cy + ry), cy, rx, ry, shape);
        const over = Math.max(0, y - (cy + ry));
        const w = Math.max(0, Math.round(base * 0.55) - over);
        if (w < 1) continue;
        for (let x = cx - w; x <= cx + w; x++){
          if (y <= mouthY + 1 && Math.abs(x - mouthC) < mclear) continue;
          g.set(x, y, bcL);
        }
      }
      hline(mouthY - 2, mouthC - 2, mouthC + 2, bc);
    }
  }

  // 皱纹（24 档省略，图标干净）
  if (detail && age > 0.62){
    if (dchance(0.7)) hline(faceTop + 3, cx - 3, cx + 3, shade(skin, -0.12));
    if (dchance(0.5)) hline(faceTop + 5, cx - 2, cx + 2, shade(skin, -0.1));
    if (dchance(0.6)){
      for (let y = mouthY - 1; y <= mouthY + 2; y++){
        g.set(cx - 4, y, shade(skin, -0.14)); g.set(cx + 4, y, shade(skin, -0.14));
      }
    }
  }

  /* ---- 6. 中世纪头饰与配饰 ---- */
  const gearC = skinDark ? mixHex(mixHex(clothC, '#4a3f30', 0.35), '#c8b898', 0.35)
                         : mixHex(clothC, '#4a3f30', 0.35);
  const gearD = shade(gearC, -0.3);
  const metal = '#8a9098', metalD = '#4e545c', metalL = '#c2c8d0';
  const linen = '#e4dcc8', linenD = '#b4aa94';

  const holeFace = (x, y, fromY) => {
    const fhw = headHW(y, cy, rx, ry, shape);
    return fhw >= 0 && y >= fromY && Math.abs(x - cx) <= fhw;
  };

  if (gear === 'hood' || gear === 'cowl'){
    // 兜帽要比头骨连同头发都高出一截，否则发顶会从帽口漏出来
    // 24 档帽口开大：露脸区域从 faceTop+1 放宽到 faceTop+3，脸不会被挤成一条缝
    const holeFrom = size <= 24 ? faceTop + 3 : faceTop + 1;
    const hcy = cy - 1, hrx = rx + 3, hry = ry + 4;
    for (let y = hcy - hry; y <= cy + 6; y++){
      const hw = ellipseHW(y, hcy, hrx, hry);
      if (hw < 0) continue;
      for (let x = cx - hw; x <= cx + hw; x++){
        if (holeFace(x, y, holeFrom)) continue;
        g.set(x, y, Math.abs(x - cx) >= hw - 1 ? gearD : gearC);
      }
    }
    if (gear === 'hood'){
      // 兜帽尖尾向后侧倒，短一些，避免头顶长出天线
      for (let i = 0; i < 4; i++)
        g.set(cx + 2 + i, faceTop - 5 - (i >> 1), i === 3 ? gearD : gearC);
    }
    for (let x = cx - rx - 2; x <= cx + rx + 2; x++)
      for (let y = cy + 3; y <= neckTop + 1; y++)
        if (Math.abs(x - cx) > rx - 1) g.set(x, y, gearD);
  }

  if (gear === 'coif'){
    const coifC = mixHex('#e2dac6', clothC, 0.22), coifD = shade(coifC, -0.24);
    const hcy = cy - 1, hrx = rx + 2, hry = ry + 3;
    for (let y = hcy - hry; y <= cy + ry - 2; y++){
      const hw = ellipseHW(y, hcy, hrx, hry);
      if (hw < 0) continue;
      for (let x = cx - hw; x <= cx + hw; x++){
        if (holeFace(x, y, faceTop + 1)) continue;
        if (y > cy + 1 && Math.abs(x - cx) < hw - 1) continue;
        g.set(x, y, Math.abs(x - cx) >= hw - 1 ? coifD : coifC);
      }
    }
    // 系带只留在耳下两侧，不横跨下巴
    for (const sgn of [-1, 1])
      g.set(cx + sgn * (rx + 1), cy + ry - 2, coifD);
  }

  if (gear === 'veil'){
    const vc = linen, vd = linenD;
    const hcy = cy - 1, hrx = rx + 3, hry = ry + 3;
    for (let y = hcy - hry; y <= cy + ry + 4; y++){
      const hw = y <= cy + ry
        ? ellipseHW(y, hcy, hrx, hry)
        : Math.max(neckW + 1, hrx - Math.round((y - cy - ry) * 0.6));
      if (hw < 0) continue;
      for (let x = cx - hw; x <= cx + hw; x++){
        if (holeFace(x, y, faceTop + 1) && y < cy + ry - 1) continue;
        if (Math.abs(x - cx) < hw - 3 && y > cy + 1) continue;
        g.set(x, y, (x + y) % 7 === 0 ? vd : vc);
      }
    }
  }

  if (gear === 'wimple'){
    const hcy = cy - 1, hrx = rx + 2, hry = ry + 3;
    for (let y = hcy - hry; y <= neckTop + 2; y++){
      let hw;
      if (y <= cy + ry) hw = ellipseHW(y, hcy, hrx, hry);
      else {
        const t = (y - cy - ry) / Math.max(1, neckTop + 2 - cy - ry);
        hw = Math.round(hrx - t * (hrx - neckW - 1));
      }
      if (hw < 0) continue;
      for (let x = cx - hw; x <= cx + hw; x++){
        if (holeFace(x, y, faceTop + 1)) continue;
        g.set(x, y, Math.abs(x - cx) >= hw - 1 ? linenD : ((x + y) % 9 === 0 ? linenD : linen));
      }
    }
  }

  if (gear === 'helmet'){
    // 96 档头盔更高更宽，比例随脸放大
    const scaleH = size >= 96 ? 1.5 : 1;
    const hcy = cy - Math.round(3 * scaleH), hrx = rx + Math.round(2 * scaleH), hry = ry - 1;
    const brim = cy - Math.round(4 * scaleH);
    for (let y = hcy - hry; y <= brim; y++){
      const hw = ellipseHW(y, hcy, hrx, hry);
      if (hw < 0) continue;
      for (let x = cx - hw; x <= cx + hw; x++){
        const topY = hcy - hry;
        let c = metal;
        if (Math.abs(x - cx) >= hw - 1) c = metalD;
        else if (y <= topY + 1) c = metalL;
        g.set(x, y, c);
      }
    }
    // 鼻梁护条：96 档改窄的 1px 条 + 侧影，不再像创可贴
    const noseBarW = size >= 96 ? 1 : 2;
    for (let y = brim; y <= cy + 1; y++){
      g.set(cx, y, metalL);
      if (noseBarW > 1) g.set(cx + 1, y, metalD);
    }
    // 眼缝：头盔下沿在眼睛位置开一条横缝，露出眼睛而不是罩住
    for (let x = cx - Math.round(rx * 0.7); x <= cx + Math.round(rx * 0.7); x++)
      g.set(x, cy - 1, size >= 96 ? skin : g.get(x, cy - 1));
    // 护耳
    for (const sgn of [-1, 1])
      for (let y = brim; y <= cy + 1; y++) g.set(cx + sgn * (rx + 1), y, metalD);
    // 铆钉与顶脊
    const riv = Math.max(2, Math.round(3 * scaleH));
    g.set(cx - riv, brim - 2, metalL); g.set(cx + riv, brim - 2, metalL);
    for (let y = hcy - hry + 1; y <= hcy - hry + Math.round(4 * scaleH); y++) if (g.get(cx, y)) g.set(cx, y, metalD);
  }

  if (gear === 'crown'){
    const gold = '#d9b043', goldD = '#a8801f';
    const hwC = headHW(cy - 6, cy, rx, ry, shape);
    for (let x = cx - hwC; x <= cx + hwC; x++){ g.set(x, cy - 7, gold); g.set(x, cy - 6, goldD); }
    for (let i = -2; i <= 2; i++){
      const x = cx + i * Math.max(2, Math.round(hwC / 3));
      g.set(x, cy - 8, gold); g.set(x, cy - 9, gold);
      g.set(x, cy - 7, '#a83f3f');
    }
  }

  if (gear === 'circlet'){
    // 额环：一条贴额的金线，中央嵌一颗宝石
    const hwC = Math.max(3, headHW(cy - 7, cy, rx, ry, shape));
    const gold = '#d9b043', goldD = '#9c7a1e';
    for (let x = cx - hwC; x <= cx + hwC; x++){
      if (!g.get(x, cy - 7) && !g.get(x, cy - 8)) continue;
      const k = Math.abs(x - cx) / Math.max(1, hwC);
      const yy = cy - 7 - Math.round((1 - k) * 1.2);
      g.set(x, yy, k > 0.85 ? goldD : gold);
    }
    g.set(cx, cy - 9, '#a8425a'); g.set(cx, cy - 8, '#8a2f45');
  }

  if (gear === 'wreath'){
    // 花环：一圈交替的叶片与小花，压低在发际上
    const hwC = Math.max(4, headHW(cy - 6, cy, rx, ry, shape));
    const leaf = '#5f7a44', leafD = '#41562f';
    const bloom =(['#d9c46a', '#c98a9a', '#d8d2be']);
    for (let x = cx - hwC; x <= cx + hwC; x++){
      const k = Math.abs(x - cx) / Math.max(1, hwC);
      const yy = cy - 6 - Math.round((1 - k * k) * 3.4);
      if (!g.get(x, yy) && !g.get(x, yy + 1)) continue;
      const c = (x % 3 === 0) ? bloom : ((x + yy) % 5 === 0 ? leafD : leaf);
      g.set(x, yy, c);
      if (x % 3 === 0) g.set(x, yy - 1, bloom);
    }
  }

  if (gear === 'mitre'){
    // 主教冠：白麻尖顶 + 金十字，底部箍一条金边
    const hwC = Math.max(4, headHW(cy - 6, cy, rx, ry, shape));
    const topY = Math.max(1, cy - 15);
    for (let y = topY; y <= cy - 6; y++){
      const t = (y - topY) / Math.max(1, (cy - 6) - topY);
      const w = Math.max(1, Math.round(hwC * 0.85 * t + 0.6));
      for (let x = cx - w; x <= cx + w; x++){
        g.set(x, y, (x === cx - w || x === cx + w) ? linenD : linen);
      }
    }
    const gold = '#d9b043';
    for (let y = topY + 2; y <= cy - 8; y++) g.set(cx, y, gold);
    for (let x = cx - 2; x <= cx + 2; x++) g.set(x, topY + 4, gold);
    for (let x = cx - hwC; x <= cx + hwC; x++){ g.set(x, cy - 6, gold); g.set(x, cy - 5, shade(gold, -0.3)); }
  }

  if (gear === 'cap'){
    const hwC = Math.max(3, headHW(cy - 6, cy, rx, ry, shape));
    // 软毡帽整体抬高 2px，帽檐盖住发际线但不压眉毛，露出额头
    for (let y = cy - 13; y <= cy - 7; y++){
      const k = (y - (cy - 13)) / 6;
      const w = Math.max(1, Math.round(hwC * (0.35 + 0.65 * k)));
      for (let x = cx - w; x <= cx + w; x++) g.set(x, y, y === cy - 13 ? gearD : gearC);
    }
    for (let x = cx - hwC - 1; x <= cx + hwC + 1; x++){ g.set(x, cy - 7, gearD); g.set(x, cy - 6, gearD); }
  }

  if (gear === 'straw'){
    const sc = '#c9a86a', sd = '#8a6d3f';
    for (let x = cx - rx - 6; x <= cx + rx + 6; x++){
      const k = Math.abs(x - cx) / (rx + 6);
      g.set(x, cy - 6 + Math.round(k * 1.6), sc);
      g.set(x, cy - 5 + Math.round(k * 1.6), sd);
    }
    for (let y = cy - 12; y <= cy - 6; y++){
      const w = Math.round((rx - 2) * Math.sqrt(Math.max(0, 1 - Math.pow((y - (cy - 6)) / 5, 2))));
      for (let x = cx - w; x <= cx + w; x++) g.set(x, y, (x + y) % 5 === 0 ? sd : sc);
    }
  }

  if (gear === 'tonsure'){
    const topY = faceTop - 2;
    for (let x = cx - rx; x <= cx + rx; x++){
      const hw = ellipseHW(topY, cy - 1, rx + 1, ry + 1);
      if (hw > 0 && Math.abs(x - cx) < hw - 1){
        g.set(x, topY, skinL); g.set(x, topY + 1, skin);
      }
    }
  }

  // 身份配饰：腰袋（长袍的十字已由袍子本身画过，不再重复）
  if (dchance(0.5) && arch.kind !== 'robe'){
    const px = cx + 5, py = beltY + 3;
    for (let y = py; y <= py + 2; y++)
      for (let x = px - 1; x <= px + 2; x++) g.set(x, y, y === py ? '#7a5a3a' : '#5a3f28');
  }
  if (dchance(0.3) && gear !== 'helmet' && gear !== 'wimple'){
    g.set(cx - 3, cy - 4, mixHex(skin, '#c06a5a', 0.6));
  }

  // 后发已在身体之前绘制完毕
  // （detail 常量已在基因段定义：48/96 档保留细节，24 档做减法）

  // 女性露发时的发带
  if (gender === 'F' && gear === 'none' && dchance(0.55)){
    const hwB = Math.max(2, headHW(cy - 6, cy, rx, ry, shape));
    for (let x = cx - hwB; x <= cx + hwB; x++){
      const c0 = g.get(x, cy - 6);
      if (c0 === hairC || c0 === hairD) g.set(x, cy - 6, trimC);
    }
  }


  /* ---- 7. 描边 ---- */
  g.outline(OUTLINE);

  /* ---- 信息：全部返回 key，文案交给 i18n ---- */
  const coveredGear = ['hood', 'cowl', 'coif', 'veil', 'wimple', 'helmet', 'mitre'];
  const hairKeyOut = coveredGear.includes(gear) ? 'covered' : hairStyle;
  let ageKey = 'prime';
  if (age < 0.18) ageKey = 'child'; else if (age < 0.38) ageKey = 'youth';
  else if (age < 0.6) ageKey = 'prime'; else if (age < 0.8) ageKey = 'middle'; else ageKey = 'elder';

  return {
    grid: g, bg,
    info: {
      role: arch.id, sex: gender, cloth: kind, gear,
      face: shape, hair: hairKeyOut, eye: eyeStyle, brow: browStyle, mouth: mouthStyle,
      age: ageKey, beard, bg: bgKind,
      // 可读的材质与配色档位
      dye: clothKey(clothC), hairColor: hairKey(hairC), skinTone: skinKey(skin),
      build: buildMult > 1.05 ? 'broad' : (buildMult < 0.97 ? 'slim' : 'normal'),
      // 供面板回显与锁定的参数
      params: { role: arch.id, sex: gender, age, shape, hair: hairStyle, eye: eyeStyle,
                brow: browStyle, mouth: mouthStyle, gear, bg: bgKind, beard,
                skin, hairC, eyeC }
    }
  };
}

/* ---------- 渲染 ---------- */
function composite(res){
  const n = res.grid.w;   // 任意档位通用
  const out = new Array(n * n);
  // 人物亮度决定背景是否压暗：亮人物配暗背景、暗人物提背景，保证轮廓分离
  let lumaSum = 0, lumaN = 0;
  for (let i = 0; i < n * n; i++){
    const c = res.grid.d[i];
    if (c){ const [r, g, b] = rgbOf(c); lumaSum += (0.299 * r + 0.587 * g + 0.114 * b); lumaN++; }
  }
  const subjL = lumaN ? lumaSum / lumaN / 255 : 0.5;
  const adj = subjL > 0.55 ? -0.22 : (subjL < 0.35 ? 0.10 : 0);   // 主体越亮背景越压
  for (let i = 0; i < n * n; i++){
    const c = res.grid.d[i];
    if (c){ out[i] = c; continue; }
    const b = res.bg.d[i];
    out[i] = b ? (adj ? shade(b, adj) : b) : null;
  }
  return out;
}
function drawTo(canvas, pixels, scale, n){
  n = n || W;   // 默认 48 档
  const ctx = canvas.getContext('2d');
  canvas.width = n * scale; canvas.height = n * scale;
  ctx.imageSmoothingEnabled = false;
  const img = ctx.createImageData(n, n);
  for (let i = 0; i < n * n; i++){
    const c = pixels[i];
    const o = i * 4;
    if (!c){ img.data[o + 3] = 0; continue; }
    const [r, g, b] = rgbOf(c);
    img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
  }
  const tmp = document.createElement('canvas');
  tmp.width = n; tmp.height = n;
  tmp.getContext('2d').putImageData(img, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(tmp, 0, 0, n * scale, n * scale);
}

/* ---------- 当前语言 ---------- */
const LANG_KEY = 'pxperson.lang';
let lang = 'zh';
try {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === 'zh' || saved === 'en') lang = saved;
  else if (!/^zh/i.test(navigator.language || '')) lang = 'en';
} catch(e){
  if (!/^zh/i.test(navigator.language || '')) lang = 'en';
}
const t = k => (I18N[lang] && I18N[lang][k] != null ? I18N[lang][k] : I18N.zh[k]);
// 分组词典取值：group 如 'role' / 'gear' / 'age'
const tg = (group, key) => {
  const g = I18N[lang][group] || {};
  if (g[key] != null) return g[key];
  const z = I18N.zh[group] || {};
  return z[key] != null ? z[key] : key;
};

function bindForge(){
  forgeEl.querySelectorAll('select').forEach(s => {
    s.addEventListener('change', () => {
      const k = s.dataset.key;
      const v = s.value;
      lock[k] = v === '' ? null : (k === 'age' ? Number(v) : v);
      // 身份硬锁性别时，清掉冲突的性别锁定
      if (k === 'role' && v){
        const a = ARCHETYPES.find(x => x.id === v);
        if (a && a.sex){
          lock.sex = null;
          const sexSel = forgeEl.querySelector('select[data-key="sex"]');
          if (sexSel) sexSel.value = '';
        }
      }
      redraw();
    });
  });

  forgeEl.querySelectorAll('.swatches').forEach(wrap => {
    wrap.addEventListener('click', e => {
      const b = e.target.closest('.sw');
      if (!b) return;
      const k = wrap.dataset.key, c = b.dataset.c;
      lock[k] = (lock[k] === c) ? null : c;
      syncForge();
      redraw();
    });
  });
}

function syncForge(){
  forgeEl.querySelectorAll('select').forEach(s => {
    const v = lock[s.dataset.key];
    s.value = v == null ? '' : String(v);
    // 已锁定的字段给个明确标记，避免"我改了但不知道有没有生效"
    s.classList.toggle('locked', v != null);
    s.title = v != null ? t('lockedHint') : '';
  });
  forgeEl.querySelectorAll('.swatches').forEach(wrap => {
    const k = wrap.dataset.key;
    let any = false;
    wrap.querySelectorAll('.sw').forEach(b => {
      const on = lock[k] === b.dataset.c;
      if (on) any = true;
      b.setAttribute('aria-pressed', String(on));
    });
    wrap.classList.toggle('locked', any);
  });

  const count = lockKeys.filter(k => lock[k] != null).length;
  resetBtn.disabled = count === 0;
  resetBtn.textContent = count ? `${t('forgeReset')} (${count})` : t('forgeReset');
}

/* ---------- 档案 ---------- */
function renderProfile(info){
  const P = t('profile');
  const items = [
    [P.cloth, tg('cloth', info.cloth) + ' · ' + tg('dye', info.dye), true],
    [P.gear, tg('gear', info.gear)],
    [P.hair, tg('hair', info.hair)],
    [P.face, tg('shape', info.face)],
    [P.eye, tg('eye', info.eye)],
    [P.brow, tg('brow', info.brow)],
    [P.mouth, tg('mouth', info.mouth)],
    [P.beard, info.beard === 'none' ? '' : tg('beard', info.beard)],
    [P.skin, tg('skinTone', info.skinTone)],
    [P.hairColor, tg('hairColor', info.hairColor)],
    [P.build, tg('build', info.build)],
    [P.bg, tg('bg', info.bg)]
  ].filter(([, v]) => v && v !== '—');

  traitsEl.innerHTML = `
    <div class="profile-hero">
      <div class="profile-role">${tg('role', info.role)}</div>
      <div class="profile-badge">${tg('sex', info.sex)} · ${tg('age', info.age)}</div>
    </div>
    <div class="profile-grid">
      ${items.map(([k, v, wide]) => `
        <div class="profile-item${wide ? ' wide' : ''}" title="${k}">
          <span>${k}</span>
          <b>${v}</b>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- 绘制 ---------- */
function redraw(){
  show(current.seed, false);
  syncForge();
}

function show(seed, pushRecent, label){
  const res = generate(seed, lock);
  const px = composite(res);
  drawTo(view, px, 8);
  current = { seed, pixels: px, info: res.info };

  // 双档同屏：同一人分别按 24/48 独立重绘
  const resS = generate(seed, { ...lock, size: SIZES.S });
  drawTo(document.getElementById('pvS'), composite(resS), 4, SIZES.S);
  drawTo(document.getElementById('pvM'), px, 4, SIZES.M);
  current.variants = { S: composite(resS) };

  renderProfile(res.info);

  // 头饰遮住发型时禁用发型下拉并说明原因
  const hairSel = forgeEl.querySelector('select[data-key="hair"]');
  if (hairSel){
    const covered = ['hood','cowl','coif','veil','wimple','helmet','mitre'].includes(res.info.params.gear);
    hairSel.disabled = covered;
    hairSel.title = covered ? t('hairLocked') : '';
  }

  // 输入框显示用户实际填的文本，数字种子也原样保留
  seedInput.value = label != null ? label : seed;
  if (pushRecent) addRecent(seed);
  else refreshRecentCurrent();
}

// 只更新"当前是哪一张"的高亮，不重建缩略图
function refreshRecentCurrent(){
  recentEl.querySelectorAll('canvas').forEach((cv, i) => {
    const it = recent[i];
    if (it) cv.classList.toggle('on', it.seed === current.seed);
  });
}

/* ---------- 最近记录（seed + 文本 + 当时锁定的定制项，完整还原） ---------- */
let recent = [];
try { recent = JSON.parse(localStorage.getItem('pxperson.recent') || '[]'); } catch(e){ recent = []; }
if (!Array.isArray(recent)) recent = [];
// 兼容旧版只存数字的格式
recent = recent.map(v => (typeof v === 'number' ? { seed: v, label: String(v) } : v))
               .filter(v => v && typeof v.seed === 'number');

const lockSnapshot = () => {
  const snap = {};
  lockKeys.forEach(k => { if (lock[k] != null) snap[k] = lock[k]; });
  return snap;
};
const applyLockSnapshot = snap => {
  lockKeys.forEach(k => lock[k] = (snap && snap[k] != null) ? snap[k] : null);
};

function addRecent(seed){
  const label = seedInput.value.trim() || String(seed);
  const locks = lockSnapshot();
  recent = [{ seed, label, locks }, ...recent.filter(v => v.seed !== seed)].slice(0, 12);
  try { localStorage.setItem('pxperson.recent', JSON.stringify(recent)); } catch(e){}
  renderRecent();
}
function renderRecent(){
  recentEl.innerHTML = '';
  if (!recent.length){
    recentEl.innerHTML = `<p class="hint" style="margin:0">${t('recentEmpty')}</p>`;
    return;
  }
  for (const it of recent){
    const cv = document.createElement('canvas');
    drawTo(cv, composite(generate(it.seed, it.locks || {})), 1);
    cv.title = it.label;
    if (it.seed === current.seed) cv.classList.add('on');
    cv.tabIndex = 0;
    cv.setAttribute('role', 'button');
    cv.setAttribute('aria-label', it.label);
    const recall = () => {
      applyLockSnapshot(it.locks);
      show(it.seed, true, it.label);
      syncForge();
    };
    cv.addEventListener('click', recall);
    cv.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); recall(); }
    });
    recentEl.appendChild(cv);
  }
}

/* ---------- 操作 ---------- */
function roll(){
  let s;
  do { s = Math.floor(Math.random() * 999999); } while (s === current.seed);
  show(s, true);
  syncForge();
}

function flash(btn, text){
  const old = btn.textContent;
  btn.textContent = text;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; }, 1200);
}

rollBtn.addEventListener('click', roll);

resetBtn.addEventListener('click', () => {
  lockKeys.forEach(k => lock[k] = null);
  syncForge();
  redraw();
});

document.getElementById('apply').addEventListener('click', () => {
  const raw = seedInput.value.trim();
  if (raw === ''){ seedInput.focus(); return; }
  // 支持「种子 + 锁定 JSON」整段粘贴回放
  const m = raw.match(/^(\S+)\s*(\{.*\})?\s*$/);
  const seedPart = m ? m[1] : raw;
  if (m && m[2]){
    try { applyLockSnapshot(JSON.parse(m[2])); } catch(e){}
  }
  const seed = /^\d+$/.test(seedPart) ? Number(seedPart) : hashStr(seedPart);
  show(seed, true, seedPart);
  syncForge();
});

seedInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); document.getElementById('apply').click(); return; }
  if (e.key === 'Escape'){ seedInput.blur(); return; }
  // 上下键翻种子历史，省得来回点缩略图
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && recent.length){
    e.preventDefault();
    const idx = recent.findIndex(v => v.seed === current.seed);
    const step = e.key === 'ArrowUp' ? 1 : -1;
    const next = recent[((idx < 0 ? -1 : idx) + step + recent.length) % recent.length];
    if (next){
      show(next.seed, false, next.label);
      syncForge();
    }
  }
});

// 空格随机；输入框、下拉、按钮聚焦时不拦截（按钮空格是原生激活）
document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA' && tag !== 'BUTTON'){
    e.preventDefault();
    roll();
  }
});

saveBtn.addEventListener('click', () => {
  // 下载当前主预览（48 档），8× 放大到 384×384
  const out = document.createElement('canvas');
  drawTo(out, current.pixels, 8, SIZES.M);
  const a = document.createElement('a');
  a.download = `pixel-person-${current.seed}.png`;
  a.href = out.toDataURL('image/png');
  a.click();
});

copyBtn.addEventListener('click', async () => {
  // 复制「种子 + 锁定参数」的可回放文本：贴回输入框即可长出同一个人
  const locks = lockSnapshot();
  const text = (seedInput.value || '').trim() || String(current.seed);
  const full = Object.keys(locks).length ? `${text} ${JSON.stringify(locks)}` : text;
  try {
    await navigator.clipboard.writeText(full);
    flash(copyBtn, t('copyDone'));
  } catch(e){
    // 非安全上下文（file://）下 clipboard 不可用，退回临时 textarea
    const ta = document.createElement('textarea');
    ta.value = full;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch(_){}
    document.body.removeChild(ta);
    flash(copyBtn, ok ? t('copyDone') : 'Ctrl+C');
  }
});

gridBtn.addEventListener('click', () => {
  const on = frameEl.classList.toggle('grid-on');
  gridBtn.classList.toggle('active', on);
  gridBtn.setAttribute('aria-pressed', String(on));
});

/* ---------- 语言切换 ---------- */
function setLang(next){
  if (next !== 'zh' && next !== 'en') return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}

  applyStaticText();
  buildForge();
  renderProfile(current.info);
  renderRecent();

  // 重绘后恢复“发型被遮挡”的禁用状态
  if (current.info){
    const hairSel = forgeEl.querySelector('select[data-key="hair"]');
    const covered = ['hood','cowl','coif','veil','wimple','helmet','mitre'].includes(current.info.params.gear);
    hairSel.disabled = covered;
    hairSel.title = covered ? t('hairLocked') : '';
  }
}

document.getElementById('langSel').addEventListener('change', e => setLang(e.target.value));

/* ---------- 启动 ---------- */
applyStaticText();
buildForge();

// URL ?s=merlin 或 ?s=merlin {"gear":"crown"}（种子 + 锁定 JSON）都能回放
const urlSeed = new URLSearchParams(location.search).get('s');
if (urlSeed){
  const m = urlSeed.match(/^(\S+)\s*(\{.*\})?\s*$/);
  if (m){
    const [, seedPart, lockPart] = m;
    if (lockPart){
      try { applyLockSnapshot(JSON.parse(lockPart)); } catch(e){}
    }
    const isNum = /^\d+$/.test(seedPart);
    show(isNum ? Number(seedPart) : hashStr(seedPart), true, seedPart);
    syncForge();
  } else {
    show(1024, true, '1024');
  }
} else {
  show(1024, true, '1024');
}
</script>
